<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <!-- 首屏（脚本执行前）的标题与说明由 app.js 按 site 配置覆盖。
       lang 属性同样由 app.js 的 applyStaticI18n() 按当前语言改写。 -->
  <title>RainyStatus</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <noscript>
    <!-- 无 JS 时无法按语言切换，因此并列两种最可能有用的语言 -->
    <p class="noscript">
      此页面需要 JavaScript 才能读取手机状态，请启用后刷新。<br />
      This page needs JavaScript to read the phone status. Please enable it and reload.
    </p>
  </noscript>
  <main class="card" id="card">
    <header class="head">
      <div class="avatar" id="avatar" aria-hidden="true">☔</div>
      <div class="head-text">
        <h1 id="title">RainyStatus</h1>
        <p class="owner" id="owner"></p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="zh-Hans" class="lang-btn">简</button>
        <button type="button" data-lang="zh-Hant" class="lang-btn">繁</button>
        <button type="button" data-lang="en" class="lang-btn">EN</button>
      </div>
    </header>

    <div class="grid">
      <div class="col">
        <section class="status" aria-live="polite">
          <div class="status-badge" id="statusBadge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">—</span>
          </div>
          <p class="status-detail" id="statusDetail"></p>
        </section>

        <section class="battery" id="batterySection">
          <div class="battery-head">
            <span class="battery-label" id="batteryLabel">🔋</span>
            <span class="battery-value" id="batteryValue">—</span>
          </div>
          <div class="battery-bar" role="progressbar" id="batteryBar" aria-valuemin="0" aria-valuemax="100">
            <div class="battery-fill" id="batteryFill"></div>
          </div>
          <p class="battery-sub" id="batterySub"></p>
        </section>
      </div>

      <div class="col">
        <section class="mood" id="moodSection" hidden>
          <h2 class="section-title" id="moodTitle">心情</h2>
          <p class="mood-text"><span id="moodEmoji"></span><span id="moodText"></span></p>
          <p class="mood-time" id="moodTime"></p>
        </section>

        <dl class="meta" id="metaSection">
          <div class="meta-row" id="metaTempRow" hidden>
            <dt id="metaTempLabel">温度</dt><dd id="metaTemp">—</dd>
          </div>
          <div class="meta-row" id="metaNetworkRow" hidden>
            <dt id="metaNetworkLabel">网络</dt><dd id="metaNetwork">—</dd>
          </div>
          <div class="meta-row" id="metaDeviceRow" hidden>
            <dt id="metaDeviceLabel">设备</dt><dd id="metaDevice">—</dd>
          </div>
          <div class="meta-row">
            <dt id="metaLastSeenLabel">最后在线</dt><dd id="metaLastSeen">—</dd>
          </div>
        </dl>
      </div>
    </div>

    <section class="chart" id="chartSection" hidden>
      <div class="chart-head">
        <h2 class="section-title" id="chartTitle">电量 · 24 小时</h2>
        <button type="button" class="chart-load" id="chartLoad">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M8.8 12.2 11 14.4l4.2-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="chartLoadText">加载图表</span>
        </button>
      </div>
      <p class="chart-hint" id="chartHint"></p>

      <div class="chart-challenge" id="chartChallenge" hidden></div>

      <div class="chart-body" id="chartBody" hidden>
        <p class="chart-summary" id="chartSummary"></p>
        <svg class="chart-svg" id="chartSvg" viewBox="0 0 320 150" preserveAspectRatio="none" role="img" aria-labelledby="chartTitle"></svg>
        <p class="chart-readout" id="chartReadout"></p>
        <ul class="chart-legend" id="chartLegend"></ul>
      </div>

      <div class="chart-moods" id="chartMoods" hidden>
        <h3 class="chart-moods-title" id="chartMoodsTitle"></h3>
        <ul class="mood-timeline" id="moodTimeline"></ul>
      </div>

      <p class="chart-note" id="chartNote"></p>
    </section>

    <footer class="foot">
      <p id="freshnessHint"></p>
      <p class="foot-sub"><span id="timezoneNote"></span></p>
      <p class="foot-sub"><span id="refreshedAt"></span></p>
    </footer>
  </main>

  <script src="/history.js"></script>
  <script src="/app.js"></script>
</body>
</html>
